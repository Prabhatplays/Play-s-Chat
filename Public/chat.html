<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Plays Chat</title>
  <style>
    #chat {
      border: 1px solid #ccc;
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
    }
    .msg { margin: 5px 0; }
    .msg span { font-weight: bold; }
  </style>
</head>
<body>
  <h1>Plays Chat</h1>
  <div id="topbar">
    <span>Logged in as: <strong id="username-display"></strong></span>
    <button onclick="window.location.href='/profile.html'">My Profile</button>
    <button onclick="logout()">Logout</button>
</div>
  <div id="chat"></div>
  <input type="text" id="message" placeholder="Type your message..." />
  <button id="sendBtn">Send</button>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/Login.html';
const payload = token.split('.')[1];
const decoded = JSON.parse(atob(payload));
document.getElementById('username-display').textContent = decoded.username;


function logout() {
    localStorage.removeItem('token');
    window.location.href = '/Login.html';
}

    const socket = io({ auth: { token } });

    socket.on('connect_error', (err) => {
      alert('Session expired. Please login again.');
      localStorage.removeItem('token');
      window.location.href = '/Login.html';
    });

    
    socket.on('load_messages', (messages) => {
      messages.forEach(({ username, text, time , profile_pic }) => {
        addMessage(username, text, new Date(time).toLocaleTimeString(), profile_pic);
      });
    });

    
    socket.on('receive_message', ({ username, text, time, profile_pic }) => {
      addMessage(username, text, time , profile_pic);
    });

    
    function addMessage(username, text, time , profile_pic) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `
      <img src="${profile_pic || '/uploads/default.png'}" alt="Profile pic" style="width:30px;height:30px;border-radius:50%;vertical-align:middle;margin-right:5px;">
      <span>${username}</span> [${time}]: ${text}
      `;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }


    document.getElementById('sendBtn').onclick = () => {
      const input = document.getElementById('message');
      const text = input.value.trim();
      if (text) {
        socket.emit('send_message', text);
        input.value = '';
      }
    };


    document.getElementById('message').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('sendBtn').click();
    });
  </script>
</body>
</html>
