<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <style>
        #profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ccc;
        }
    </style>
</head>
<body>

    
    <h2 id="username-display"></h2>

   
    <img id="profile-pic" src="/uploads/default.png" alt="Profile Picture">

    <br><br>

  
    <input type="file" id="pic-input" accept="image/*">
    <button id="upload-btn">Upload Picture</button>

    <p id="message"></p>

    <script>
      
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/Login.html';

       
        const payload = token.split('.')[1];
        const decoded = JSON.parse(atob(payload));

     
        document.getElementById('username-display').textContent = decoded.username;

        // 
        fetch('/profile/me', {
            method: 'GET',
            headers: {
                'Authorization': 'Bearer ' + token
            }
        })
        .then(res => res.json())
        .then(data => {
            // if user has a profile pic, show it
            if (data.profile_pic) {
                document.getElementById('profile-pic').src = data.profile_pic;
            }
        });

        // Step 5: upload button click
        document.getElementById('upload-btn').onclick = async () => {

            // get the file user picked
            const file = document.getElementById('pic-input').files[0];

            if (!file) {
                alert('Please pick an image first!');
                return;
            }

            // create FormData and add file
            const formData = new FormData();
            formData.append('profile_pic', file);

            // send to server
            const res = await fetch('/profile/upload', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token
                    // NO Content-Type here — browser sets it automatically for FormData
                },
                body: formData
            });

            const data = await res.json();

            if (res.ok) {
                // update image on page immediately
                document.getElementById('profile-pic').src = data.profile_pic;
                document.getElementById('message').textContent = 'Profile picture updated!';
            } else {
                document.getElementById('message').textContent = data.message;
            }
        };
    </script>
</body>
</html>
